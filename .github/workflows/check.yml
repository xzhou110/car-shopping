# The gate (principle 8, D:/Meaningful/AI/agent-skills/rules/engineering-principles.md): every push and pull request
# runs `npm run check` (lint, typecheck, tests, build). Pushes to main run the same job inside deploy.yml, whose build
# job needs it, so this workflow covers every other branch and pull requests without running the gate twice on main.
# Copied from the engineering-audit skill's templates/check.yml on 2026-10-21; the app lives in app/ and CI stays on
# Node 20 as in deploy.yml (the machine runs Node 24; both pass).
name: check

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
